<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天头像测试器</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入Cropper.js库用于图片裁剪 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>聊天头像测试器</h1>
            <p>上传并裁剪您的头像，测试在聊天环境中的效果</p>
        </header>

        <main>
            <div class="chat-container">
                <div class="chat-header">
                    <h2>聊天预览</h2>
                </div>
                <div class="chat-messages">
                    <div class="message received">
                        <div class="avatar">
                            <img src="img/default-avatar.png" alt="默认头像" id="chat-avatar-other">
                        </div>
                        <div class="message-content">
                            <div class="sender">对方</div>
                            <div class="text">你好！这是一条测试消息。</div>
                        </div>
                    </div>
                    <div class="message sent">
                        <div class="message-content">
                            <div class="sender">我</div>
                            <div class="text">你好！这是我的回复。</div>
                        </div>
                        <div class="avatar">
                            <img src="img/default-avatar.png" alt="我的头像" id="chat-avatar-me">
                        </div>
                    </div>
                    <div class="message received">
                        <div class="avatar">
                            <img src="img/default-avatar.png" alt="默认头像" id="chat-avatar-other2">
                        </div>
                        <div class="message-content">
                            <div class="sender">对方</div>
                            <div class="text">你的新头像看起来不错！</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="avatar-upload-container">
                <h2>头像上传与裁剪</h2>
                <div class="upload-section">
                    <label for="avatar-upload" class="upload-btn">选择图片</label>
                    <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
                </div>
                
                <div class="cropper-container" style="display: none;">
                    <div class="img-container">
                        <img id="cropper-img" src="" alt="待裁剪的图片">
                    </div>
                    <div class="cropper-controls">
                        <button id="rotate-left">↺ 向左旋转</button>
                        <button id="rotate-right">↻ 向右旋转</button>
                        <button id="zoom-in">+ 放大</button>
                        <button id="zoom-out">- 缩小</button>
                        <button id="crop-btn" class="primary-btn">确认裁剪</button>
                        <button id="cancel-btn">取消</button>
                    </div>
                </div>

                <div class="preview-container">
                    <h3>头像预览</h3>
                    <div class="avatar-preview">
                        <img src="img/default-avatar.png" alt="头像预览" id="avatar-preview">
                    </div>
                    <button id="apply-btn" class="primary-btn" disabled>应用到聊天</button>
                </div>
            </div>
        </main>

        <footer>
            <p>聊天头像测试器 &copy; 2023</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
