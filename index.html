<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://nijika-jia.github.io/Projects/">
    <title>Welcome!!!</title>
    <link rel="icon" type="image/png" href="https://pic.imgdb.cn/item/6763dda5d0e0a243d4e65aaf.png">

    <style>
        body {
            margin: 0;
            background-color:  #dfa69a;
            color: white;
            text-align: center;
            font-size: 24px;
            overflow: auto;
            width: 100%;
            height: 100%;
        }
        .box {
            background: rgba(121, 66, 66, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            margin: 50px auto;
            width: 80%;
            max-width: 500px;
            padding: 20px;
            border-radius: 10px;
        }
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
    </style>
    <script>
        let timeLeft = 5;
        function updateCountdown() {
            document.getElementById("countdown").innerText = timeLeft;
            timeLeft--;
            if (timeLeft < 0) {
                clearInterval(timer);
            }
        }
        let timer = setInterval(updateCountdown, 1000);
    </script>
</head>
<body>
    <div>
        <div class="box">
        <h2 style="color: #FEAE93;">Welcome to the My Project!</h2>
        <p style="color: #FEAE93;"><span id="countdown">5</span> 秒后自动跳转</p>
        <p style="color: #FEAE93;">如果没有自动跳转，请 <a href="https://your-target-link.com">点击这里</a>。</p>
        <img src="https://pic.imgdb.cn/item/6762e95cd0e0a243d4e62d8f.jpg" alt="" width="100%">
    </div>
    </div>
    
    <canvas id="background-canvas"></canvas>
    <script>
        window.onload = function () {
            var canvas = document.querySelector('#background-canvas'),
                ctx = canvas.getContext('2d');

            // 调整画布大小以适应窗口
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                dots.nb = Math.floor((canvas.width * canvas.height) / 1000); // 动态调整粒子数量
                dots.array = [];
                createDots();
            }
            window.addEventListener('resize', resizeCanvas);

            // 鼠标或触摸位置
            var mousePosition = { x: canvas.width / 2, y: canvas.height / 2 };

            // 粒子属性
            var dots = {
                nb: Math.floor((canvas.width * canvas.height) / 1000),
                distance: 50,
                d_radius: 70,
                array: []
            };

            // 定义粒子点
            function Dot() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = -.5 + Math.random();
                this.vy = -.5 + Math.random();
                this.radius = Math.random() * 2;
                this.color = new Color();
            }

            // 定义颜色
            function Color(min) {
                min = min || 0;
                this.r = colorValue(min);
                this.g = colorValue(min);
                this.b = colorValue(min);
                this.style = createColorStyle(this.r, this.g, this.b);
            }

            function colorValue(min) {
                return Math.floor(Math.random() * 255 + min);
            }

            function createColorStyle(r, g, b) {
                return 'rgba(' + r + ',' + g + ',' + b + ', 0.8)';
            }

            Dot.prototype = {
                draw: function () {
                    ctx.beginPath();
                    ctx.fillStyle = this.color.style;
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                    ctx.fill();
                }
            };

            function moveDots() {
                for (var i = 0; i < dots.nb; i++) {
                    var dot = dots.array[i];
                    if (dot.y < 0 || dot.y > canvas.height) {
                        dot.vy = -dot.vy;
                    }
                    if (dot.x < 0 || dot.x > canvas.width) {
                        dot.vx = -dot.vx;
                    }
                    dot.x += dot.vx;
                    dot.y += dot.vy;
                }
            }

            function connectDots() {
                for (var i = 0; i < dots.nb; i++) {
                    for (var j = i; j < dots.nb; j++) {
                        var i_dot = dots.array[i];
                        var j_dot = dots.array[j];

                        if ((i_dot.x - j_dot.x) < dots.distance &&
                            (i_dot.y - j_dot.y) < dots.distance &&
                            (i_dot.x - j_dot.x) > -dots.distance &&
                            (i_dot.y - j_dot.y) > -dots.distance) {
                            if ((i_dot.x - mousePosition.x) < dots.d_radius &&
                                (i_dot.y - mousePosition.y) < dots.d_radius &&
                                (i_dot.x - mousePosition.x) > -dots.d_radius &&
                                (i_dot.y - mousePosition.y) > -dots.d_radius) {
                                ctx.beginPath();
                                ctx.strokeStyle = averageColorStyles(i_dot, j_dot);
                                ctx.moveTo(i_dot.x, i_dot.y);
                                ctx.lineTo(j_dot.x, j_dot.y);
                                ctx.stroke();
                                ctx.closePath();
                            }
                        }
                    }
                }
            }

            function averageColorStyles(dot1, dot2) {
                var color1 = dot1.color, color2 = dot2.color;
                var r = mixComponents(color1.r, dot1.radius, color2.r, dot2.radius);
                var g = mixComponents(color1.g, dot1.radius, color2.g, dot2.radius);
                var b = mixComponents(color1.b, dot1.radius, color2.b, dot2.radius);
                return createColorStyle(Math.floor(r), Math.floor(g), Math.floor(b));
            }

            function mixComponents(comp1, weight1, comp2, weight2) {
                return (comp1 * weight1 + comp2 * weight2) / (weight1 + weight2);
            }

            function createDots() {
                for (var i = 0; i < dots.nb; i++) {
                    dots.array.push(new Dot());
                }
            }

            function drawDots() {
                for (var i = 0; i < dots.nb; i++) {
                    dots.array[i].draw();
                }
            }

            function animateDots() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                moveDots();
                connectDots();
                drawDots();
                requestAnimationFrame(animateDots);
            }

            createDots();
            animateDots();

            // 鼠标和触摸事件
            document.addEventListener('mousemove', function (e) {
                mousePosition.x = e.pageX;
                mousePosition.y = e.pageY;
            });

            document.addEventListener('touchmove', function (e) {
                var touch = e.touches[0];
                mousePosition.x = touch.pageX;
                mousePosition.y = touch.pageY;
            });

            document.addEventListener('mouseleave', function () {
                mousePosition.x = canvas.width / 2;
                mousePosition.y = canvas.height / 2;
            });

            document.addEventListener('touchend', function () {
                mousePosition.x = canvas.width / 2;
                mousePosition.y = canvas.height / 2;
            });

            resizeCanvas();
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
    function ClickFrontShow() {
        // 动态文字和对应音频文件的映射
        this.items = [
            { text: "Ciallo～(∠・ω< )⌒★", audio: './ciallo.aac' },
            { text: "Ciallo～(∠・ω< )⌒★", audio: './caillo_mgl.wav' },
            { text: "啵央央~", audio: './星号.wav' },
        ];
        this.colo = ['#FF69B4', '#ff6651', 'orange', '#FF00FF', '#00FF7F', '#00BFFF', '#BA55D3'];
        this.elBody = document.body;
        this.cls = 0; // 用于动态类名
    }

    // 预加载音频
    ClickFrontShow.prototype.preloadAudio = function () {
        this.items.forEach(item => {
            const audio = new Audio(item.audio);
            audio.load(); // 预加载音频
        });
    };

    ClickFrontShow.prototype.init = function (items, colorArray) {
        this.items = items || this.items;
        this.colo = colorArray || this.colo;
        this.listenMouse();
    };

    ClickFrontShow.prototype.createFront = function (classname, text, color) {
        let ospan = document.createElement('span');
        let cssText = "position:absolute; height: 1px; cursor: default; transform: translate(-50%,-50%); font-weight: bold; opacity: 1; z-index: 1000; transition: 1s; font-size: 20px;";
        this.elBody.appendChild(ospan);
        ospan.className = String(classname);
        ospan.style.cssText = cssText + "-moz-user-select: none;-webkit-user-select: none;-ms-user-select: none;user-select: none;";
        ospan.style.color = color;
        ospan.innerHTML = text;
    };

    ClickFrontShow.prototype.listenMouse = function () {
        const self = this;
        document.onclick = async function (e) {
            // 随机选择一个文字和对应的音频
            const randomIndex = Math.floor(Math.random() * self.items.length);
            const randomItem = self.items[randomIndex];
            const randomColor = self.colo[Math.floor(Math.random() * self.colo.length)];

            // 更新动态类名
            if (self.cls === 20) {
                self.cls = 0;
            } else {
                self.cls += 1;
            }

            // 创建动态文字
            self.createFront(self.cls, randomItem.text, randomColor);
            let el = document.getElementsByClassName(self.cls)[0];
            el.style.left = e.clientX + 'px';
            el.style.top = e.clientY + 'px';

            // 添加动画效果
            setTimeout(function () {
                el.style.opacity = 0;
                el.style.top = el.offsetTop - 100 + 'px';
            }, 100);
            setTimeout(function () {
                self.elBody.removeChild(el);
            }, 2000);

            // 异步播放音频
            try {
                const audio = new Audio(randomItem.audio);
                await audio.play();
            } catch (err) {
                console.error("音频播放失败:", err);
            }
        };
    };

    const frontShow = new ClickFrontShow();
    frontShow.preloadAudio(); // 预加载音频
    frontShow.init();
});

    </script>
</body>
</html>
